{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/add_product_style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
{% endblock %}

{% block content %}
    <br>
    <h1 class="product-form-title">Add new product</h1><br><br>

    <form method="POST" enctype="multipart/form-data" class="product-form">
        {% csrf_token %}

        <div class="product-form-group">
            <div class="input-group">
                <span class="input-group-text">Product name</span>
                <input type="text" name="name_tag" class="form-control product-form-input">
            </div>
        </div>

        <div class="product-form-group">
            <div class="input-group">
                <span class="input-group-text">Category</span>
                <input type="text" name="category" class="form-control product-form-input">
            </div>
        </div>

        <div class="product-form-group">
            <div class="input-group">
                <span class="input-group-text">Price</span>
                <input type="number" name="price" class="form-control product-form-input">
            </div>
        </div>

    <div class="product-form-group">
        <div class="input-group">
            <span class="input-group-text">Commission</span>
            <input type="number" min="0" name="commission" class="form-control product-form-input">
        </div>
    </div>

    <div class="product-form-group">
        <div class="input-group">
            <span class="input-group-text">Weight</span>
            <input type="number" min="0" name="weight" class="form-control product-form-input">
        </div>
    </div>

    <div class="product-form-group">
        <div class="input-group">
            <span class="input-group-text">Expiration date</span>
            <input type="date" name="exp_date" class="form-control product-form-input" id="expDate">
        </div>
    </div>

    <div class="product-form-group">
        <div class="input-group">
            <span class="input-group-text">Amount</span>
            <input type="number" min="0" name="amount" class="form-control product-form-input">
        </div>
    </div>

    <div class="product-form-group">
        <div class="input-group">
            <span class="input-group-text">Producer</span>
            <input type="text" name="producer" class="form-control product-form-input">
        </div>
    </div>

    <div class="product-form-group">
        <div class="mb-3 text-center w-100">
            <label for="formFile" class="form-label">Image of Your product</label>
            <input class="form-control product-form-input" type="file" name="image" id="formFile">
        </div>
    </div>

    <div class="product-form-group">
        <button class="btn product-form-btn" type="submit">Confirm added</button>
    </div>

        <h3 class="product-form-warning">All fields are required</h3>

    </form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8"
        crossorigin="anonymous"></script>
<script src="{% static 'js/add_product.js' %}"></script>
{% endblock %}
