<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Dodaj Produkt</title>
</head>
<body>
<br>
<h1>Add new product</h1><br><br>

<form method="POST">
    {% csrf_token %}

    <div class="d-flex justify-content-center">
        <div class="input-group" style="width: 300px;">
            <span class="input-group-text" id="inputGroup-sizing-lg">Product name</span>
            <input type="text" name="name_tag" class="form-control" aria-label="Sizing example input"
                   aria-describedby="inputGroup-sizing-lg">
        </div>
    </div>
    <br/>

    <div class="d-flex justify-content-center">
        <div class="input-group" style="width: 300px;">
            <span class="input-group-text" id="inputGroup-sizing-lg">Category</span>
            <input type="text" name="category" class="form-control" aria-label="Sizing example input"
                   aria-describedby="inputGroup-sizing-lg">
        </div>
    </div>
    <br/>

    <div class="d-flex justify-content-center">
        <div class="input-group" style="width: 300px;">
            <span class="input-group-text" id="inputGroup-sizing-lg">Price</span>
            <input type="number" name="price" class="form-control" aria-label="Sizing example input"
                   aria-describedby="inputGroup-sizing-lg">
        </div>
    </div>
    <br/>

    <div class="d-flex justify-content-center">
        <div class="input-group" style="width: 300px;">
            <span class="input-group-text" id="inputGroup-sizing-lg">Commission</span>
            <input type="number" name="commission" class="form-control" aria-label="Sizing example input"
                   aria-describedby="inputGroup-sizing-lg">
        </div>
    </div>
    <br/>

    <div class="d-flex justify-content-center">
        <div class="input-group" style="width: 300px;">
            <span class="input-group-text" id="inputGroup-sizing-lg">Weight</span>
            <input type="number" name="weight" class="form-control" aria-label="Sizing example input"
                   aria-describedby="inputGroup-sizing-lg">
        </div>
    </div>
    <br/>

    <div class="d-flex justify-content-center">
        <div class="input-group" style="width: 300px;">
            <span class="input-group-text" id="inputGroup-sizing-lg">Exp date</span>
            <input type="date" name="exp_date" class="form-control" aria-label="Sizing example input"
                   aria-describedby="inputGroup-sizing-lg">
        </div>
    </div>
    <br/>

    <div class="d-flex justify-content-center">
        <div class="input-group" style="width: 300px;">
            <span class="input-group-text" id="inputGroup-sizing-lg">Ilość</span>
            <input type="number" name="amount" class="form-control" aria-label="Sizing example input"
                   aria-describedby="inputGroup-sizing-lg">
        </div>
    </div>
    <br/>

    <div class="d-flex justify-content-center">
        <div class="input-group" style="width: 300px;">
            <span class="input-group-text" id="inputGroup-sizing-lg">Producer</span>
            <input type="text" name="producer" class="form-control" aria-label="Sizing example input"
                   aria-describedby="inputGroup-sizing-lg">
        </div>
    </div>
    <br/>

    <div class="d-flex justify-content-center">
        <div class="input-group" style="width: 300px;">
            <div class="mb-3 text-center w-100">
                <label for="formFile" class="form-label">Image of Your product</label>
                <input class="form-control" type="file" id="formFile">
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center">
    <div class="d-grid gap-2 d-md-block">
  <button class="btn btn-primary" type="submit">Confirm added</button>
    </div>
    </div>


</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8"
        crossorigin="anonymous"></script>
</body>
</html>
