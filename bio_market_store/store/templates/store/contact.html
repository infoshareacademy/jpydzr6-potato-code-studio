<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🥔Contact🥔</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'store/css/cover.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Megrim&display=swap" rel="stylesheet">
    <link rel="icon" type="image/ico" href="{% static 'store/images/PotatoFavicon.ico' %}">
    <link rel="stylesheet" href="{% static 'store/css/contact.css' %}">

</head>
<body>


<header class="navbar navbar-expand-md fixed-top">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h3 class="float-md-start mb-0" id="BioPotato">BioPotato</h3>
        <nav class="nav nav-masthead justify-content-center float-md-end">
            <a class="nav-link active" id="storeNav" href="">Store</a>
            <a class="nav-link" id="aboutNav" href="{% url 'about-page' %}">About</a>
            <a class="nav-link" id="contactNav" href="{% url 'cover-page'%}">Home</a>
        </nav>
    </div>
</header>
<div class="contact-container">
    <form action="" class="contact-left">
        <div class="contact-left-title">
            <h2 class="typewriter">Any questions?</h2>
            <hr>
        </div>
        <input type="text" placeholder="Name" placeholder="Tour name" class="contact-input" required>
        <input type="email" placeholder="Email" placeholder="Email" class="contact-input" required>
        <input type="text" placeholder="Subject" placeholder="Subject" class="contact-input" required>
        <textarea name="" id="" cols="30" rows="10" placeholder="Can't send anything as for now, just doing the front rn" class="contact-input" required></textarea>
        <button type="submit" class="btn">Send <i class="fas fa-paper-plane"></i></button>
    </form>
    <div class="contact-right">
        <img src="{% static 'store/images/LilPotato.png' %}" alt="pixel art of people">
    </div>
</div>
</body>
</html>
