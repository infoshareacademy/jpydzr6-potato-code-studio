{% load static %}
<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}🥔BioPotato🥔{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/about.css' %}">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Megrim&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  <body>
    <nav class="navbar navbar-expand-md fixed-top nav-masthead">
        <a class="navbar-brand" href="/">BioPotato</a>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link" id="storeNav" href="">Store</a>
            <a class="nav-link" id="aboutNav" href="{% url 'about-page' %}">About</a>
            <a class="nav-link" id="contactNav" href="{% url 'contact-page'%}">Contact</a>
          </div>
        </div>
    </nav>
    
    <div class="container my-5">{% block content %}{% endblock %}</div>

    <footer class="mt-auto text-white-50 ">
        <p>Julia Blaumann, Jakub Charkiewicz, Paweł Enerlich, Maciej Kusztal, Wojciech Wawrzyszko</p>
    </footer>
  {% block extra_js %}
   
  {% endblock %}

  </body>
</html>
