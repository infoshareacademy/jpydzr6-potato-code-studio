{% extends 'base.html' %} {% load static %} {% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Megrim&display=swap" rel="stylesheet">
<link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
<link rel="stylesheet" href="{% static 'css/contact.css' %}">
{% endblock %}
{% block content %}
<div class="contact-container">
    <form action="" class="contact-left">
        <div class="contact-left-title">
            <h2 class="typewriter">Any questions?</h2>
            <hr>
        </div>
        <input type="text" placeholder="Name" placeholder="Tour name" class="contact-input" required>
        <input type="email" placeholder="Email" placeholder="Email" class="contact-input" required>
        <input type="text" placeholder="Subject" placeholder="Subject" class="contact-input" required>
        <textarea name="" id="" cols="30" rows="10" placeholder="Can't send anything as for now, just doing the front rn" class="contact-input" required></textarea>
        <button type="submit" class="btn">Send <i class="fa-solid fa-paper-plane"></i></button>
    </form>
    <div class="contact-right">
        <img src="{% static 'images/LilPotato.png' %}" alt="pixel art of people">
    </div>
</div>
{% endblock %}
