{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bio Market</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    {% comment %} <link href="{% static 'css/google_sign_in_style.css' %}" rel="stylesheet" /> {% endcomment %}
    <script src={% static 'js/auth_google.js' %}></script>
   <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center">Hello</h1>

      {% if user.is_authenticated %}
      <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Logout</button>
      </form>
      {% else %}
      <div>
        {% csrf_token %}

        <a href="/login" type="submit" class="btn btn-primary">Sign In</a>
        <a href="/register" type="submit" class="btn btn-primary">Sign Up</a>
        <div id="g_id_onload" data-client_id="{{ google_client_id }}" data-context="signin" data-ux_mode="popup" data-login_uri="https://127.0.0.1:8000/google-auth-receiver" data-auto_prompt="false">Google sign in</div>
        <div class="g_id_signin" data-type="icon" data-shape="square" data-theme="outline" data-text="signin_with" data-size="large"></div>
      </div>
      {% endif %}
    </div>
  </body>
</html>
