{% extends 'base.html' %}


{% block content %}


    <div class="container">



        <div class="productContainer">
            <div class="thumbnail">
                <img src="{{product.picture.url}}" alt="">
            </div>

            <div class="action">

                <p>{{product.name}}</p>

                <p>{{product.price}} PLN</p>

                <button value="{{product.id}}">Add to Cart</button>

            </div>


        </div>















    </div>

{% endblock content %}
