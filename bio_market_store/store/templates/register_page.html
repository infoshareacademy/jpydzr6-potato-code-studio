{% extends 'base.html' %} {%load static%} {% block extra_head %}
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
  crossorigin="anonymous"
/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="{% static 'css/register_page_styles.css' %}" rel="stylesheet" />
<script src="{% static 'js/alerts.js' %}"></script>
{% endblock %}
{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous"></script>
<script src="{% static 'js/register_user.js' %}"></script>
{% endblock %}
{% block content %}
<div class="container register-form">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-lg">
            <div class="card-header text-center text-white">
              <h4>Join Us!</h4>
            </div>
            <div class="card-body">
              {% if error %}
              <div class="alert alert-danger">{{ error }}</div>
              {% endif %}
              <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <input
                      type="password"
                      id="password"
                      name="password"
                      class="form-control"
                      required
                    />
                    <span class="input-group-text">
                      <i class="fa fa-eye" id="togglePassword1" style="cursor: pointer;"></i>
                    </span>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="confirm_password" class="form-label">Confirm Password</label>
                  <div class="input-group">
                    <input
                      type="password"
                      id="confirm_password"
                      name="confirm_password"
                      class="form-control"
                      required
                    />
                    <span class="input-group-text">
                        <i class="fa fa-eye" id="togglePassword2" style="cursor: pointer;"></i>
                    </span>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="role" class="form-label">Select Role</label>
                  <div class="input-group">
                    <select id="role" name="role" class="form-control" required>
                      <option value="client">Client</option>
                      <option value="seller">Seller</option>
                      {% if debug %}
                        <option value="contributor">Contributor</option>
                      {% endif %}
                    </select>
                    <span class="input-group-text">
                      <i class="fa-solid fa-arrow-down"></i>
                    </span>
                  </div>
                </div>
                <button type="submit" class="btn w-100 text-white" >
                  Sign Up
                </button>
              </form>
            </div>
            <div class="card-footer text-center">
              <small
                >Already have an account?
                <a href="/login/" class="login-join">Login here</a>
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
{% endblock %}
